# 本脚本已精简为「仅字幕翻译」：不再调用 faster-whisper 生成字幕
# 用法：加载外部 srt 字幕后按 ALT+f，生成 xxx.translate.srt 与双语 xxx.Chinese.ass

## GPT API 选项 ###
# 与其他结构与 GPT API 相同的 AI API 兼容
api_url=http://localhost:1234/v1/chat/completions
# api key 需自行在对应 AI 平台的个人账号下申请
api_key=lmstudio
# 指定要使用的 AI 模型
api_mode=hy-mt2-7b-abliterated
# 采样温度。翻译场景不需要创造性，温度越高模型越容易跑偏、
# 生成越多废话 token，既慢又不稳；重试时脚本会自动降到 0.2
api_temperature=0.3
# 单个请求超时（秒）。防止服务端卡住导致翻译一直挂着
api_timeout=120
# API 使用的每分钟速率。有关说明请参阅相应的 API 文档
# 本地 LM Studio 没有速率限制，调高可以解除脚本自带的节流
api_rate=60
# 每次请求打包多少条字幕。越大请求越少、整体越快；
# 若控制台出现 Mismatch 警告（模型漏行/并行），调回 20
batch_size=20
# 同时进行的请求数。实测本机 LM Studio 的共享上下文约 8k token，
# batch_size × max_parallel 控制在 120 行以内才不会报 Context size exceeded
# （30×4 实测 4.57 行/秒且零报错；40×4 有一半请求失败）
max_parallel=4
# 每批请求带上前面几条字幕作为上下文，避免人名/称谓/语气在批次之间漂移
# 2~4 比较合适，设 0 关闭
context_lines=3
# 指定 AI 翻译的目标语言
translate=Chinese
# 清理译文行尾不合理的标点。中英文都覆盖：
#   去掉：。 ． ｡ . / ， , 、 、 ； ; ： : · ・（含行尾全角空格、NBSP）
# 实测模型即使被提示过仍会给几乎每行加「。」，偶尔还会以逗号/冒号/分号收尾
# （通常是它把两行源字幕合并了），这些统一后处理掉；
# 保留：... … ！ ！ ？ ？ ~ ～ —— --（语气/被打断，删了会改变意思）
# 设 no 关闭
strip_trailing_punctuation=yes
# 跟随播放进度翻译：优先翻译你正在看/马上要看的那几段，而不是从头依次翻
# 跳转进度后会立刻改翻新位置附近的内容；设 no 则恢复从头顺序翻译
follow_playback=yes
# 翻译过程中刷新双语 ass 的间隔（秒）。每次刷新都要重写文件并让 mpv 重新加载字幕轨，
# 间隔太小会白白多出很多次IO；只影响刷新频率，不影响最终字幕内容与显示效果。
# 脚本会限制在 0.5~5 秒之间
refresh_interval=0.5
# 指定生成的 ass 字幕所使用的字体
font_name=Noto Sans CJK SC
# 译文行字号（1920x1080 脚本坐标系下）
font_size=70
# 原文行字号，比译文小一级才有主次之分
orig_font_size=46
# 原文行颜色，按常规 RGB 十六进制写（脚本会自动转成 ASS 的 BGR）。
# 默认 EBA862 与上游脚本沿用下来的观感一致（偏琥珀色）。
# 想要浅蓝就改成 62A8EB
orig_color=EBA862
# 原文行透明度，0 完全不透明，255 全透明；想要原文更淡可以设 60~90
orig_alpha=0
# 字幕距画面底部的距离，两行字幕时贴太近会显得挤
margin_v=40
# 正在看的几行拆成微型请求先发，翻完立即上屏
hot_lines=2
explicit_vocab_hint=小穴、肉棒、口交、做爱、后庭、淫水、潮吹、内射、高潮、骚、奶子、奶头、舔、插入、抽插、骑乘、后入、发情、淫叫、勃起
